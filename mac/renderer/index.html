<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; frame-src 'self' about: data:; script-src 'self'">
<title>FondsOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="drag"></div>
    <div class="brand">FondsOS <span>archive desk</span></div>
    <button id="importBtn" class="primary">Open package…</button>
    <input id="globalSearch" type="search" placeholder="Search all collections">
    <div id="library"></div>
  </aside>
  <main id="main"></main>
  <section id="detail" class="hidden"></section>
</div>
<div id="drop" class="hidden"><div>Drop a Fonds ZIP to import</div></div>
<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
