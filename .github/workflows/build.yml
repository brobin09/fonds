name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Name the APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk fonds.apk

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fonds-apk
          path: fonds.apk

      - name: Publish as latest release (download on the phone)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fonds build ${{ github.run_number }}
          body: "Open this page on your Pixel and tap fonds.apk to install or update."
          files: fonds.apk
          make_latest: true

      - name: Save build log to ci-logs branch
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch build.log
          grep -nE "^e: |^w: .*deprecated|error:|What went wrong|FAILURE|Could not (find|resolve)|BUILD (SUCCESSFUL|FAILED)" build.log > errors.txt || true
          mkdir -p /tmp/logrepo && cp build.log errors.txt /tmp/logrepo/
          cd /tmp/logrepo
          echo "run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA} status ${{ job.status }}" > status.txt
          git init -q -b ci-logs
          git config user.name "fonds-ci"
          git config user.email "fonds-ci@users.noreply.github.com"
          git add -A
          git commit -qm "build log for run ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
